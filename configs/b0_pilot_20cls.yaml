experiment:
  name: b0_pilot_20cls_sift_bovw
  status: pilot
  seed: 9517
  output_dir: outputs/b0_pilot_20cls_sift_bovw

data:
  version: Dataset v1.0 - FROZEN
  root: Dataset_v1.0_FROZEN
  metadata_dir: data_metadata
  full_num_classes: 500
  num_classes: 20          # pilot subset; set null for all 500
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null

sift:
  cache_dir: outputs/cache/sift_b0_pilot
  n_features: 0
  contrast_threshold: 0.04
  max_side: 512
  overwrite_cache: false

vocabulary:
  size: 200
  max_descriptors: 50000
  batch_size: 4096
  max_iter: 100

encode:
  tfidf: true
  l2_normalize: true

classifiers:
  - name: svm
    params:
      C: 1.0
      max_iter: 5000
      dual: false
  - name: random_forest
    params:
      n_estimators: 200
      max_depth: null
      n_jobs: -1
