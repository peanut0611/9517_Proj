experiment:
  name: b1_ablate_k500
  status: ablation
  seed: 9517
  output_dir: outputs/b1_ablate_k500

data:
  version: Dataset v1.0 - FROZEN
  root: Dataset_v1.0_FROZEN
  metadata_dir: data_metadata
  full_num_classes: 500
  num_classes: null
  max_train_samples: null
  max_val_samples: null
  max_test_samples: null

sift:
  cache_dir: outputs/cache/sift_full500
  n_features: 0
  contrast_threshold: 0.04
  max_side: 512
  overwrite_cache: false

vocabulary:
  size: 500
  max_descriptors: 500000
  batch_size: 8192
  max_iter: 100

encode:
  tfidf: true
  l2_normalize: true

# Vocabulary ablation: vary K only; compare with Linear SVM.
classifiers:
  - name: svm
    params:
      C: 1.0
      max_iter: 8000
      dual: false
